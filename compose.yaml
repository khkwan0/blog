services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: blog_prod
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Development Mode
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: next/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./next:/app
      - /app/node_modules
      - /app/.next
      - ./prisma:/app/prisma
      - ./storage/media:/data/media
      - ./storage/youtube-cookies.txt:/data/youtube-cookies.txt:ro
    env_file:
      - ./next/.env.development
    environment:
      - APP_ENV=development
      - RUN_PRISMA_BOOTSTRAP=1
      - MEDIA_STORAGE_PATH=/data/media
      - YTDLP_COOKIES_PATH=/data/youtube-cookies.txt
      - ENABLE_VIDEO_DOWNLOAD=true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ./entrypoint.sh
    command: bun run dev

  # Production Mode
  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: next/Dockerfile
      target: runner
    ports:
      - "3000:3000"
    volumes:
      - ./prisma:/app/prisma
      - ./storage/media:/data/media
      - ./storage/youtube-cookies.txt:/data/youtube-cookies.txt:ro
    env_file:
      - ./next/.env.production
    environment:
      - APP_ENV=production
      - RUN_PRISMA_BOOTSTRAP=1
      - BETTER_AUTH_URL=https://shitsue.com
      - MEDIA_STORAGE_PATH=/data/media
      - YTDLP_COOKIES_PATH=/data/youtube-cookies.txt
      - ENABLE_VIDEO_DOWNLOAD=true
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["./entrypoint.sh"]
    command: ["bun", "server.js"]
    restart: unless-stopped 

  # Prisma Studio for development DB
  studio-dev:
    profiles: ["dev", "studio"]
    build:
      context: .
      dockerfile: next/Dockerfile
      target: dev
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./next:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    environment:
      - DATABASE_URL=postgresql://blog:blog@postgres:5432/blog_dev
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "bunx prisma studio --config=/app/prisma.config.js --url=postgresql://blog:blog@postgres:5432/blog_dev --port 5555 --browser none"

  # Prisma Studio for production DB
  studio-prod:
    profiles: ["studio-prod"]
    build:
      context: .
      dockerfile: next/Dockerfile
      target: dev
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./next:/app
      - /app/node_modules
      - ./prisma:/app/prisma
    environment:
      - DATABASE_URL=postgresql://blog:blog@postgres:5432/blog_prod
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "bunx prisma studio --config=/app/prisma.config.js --url=postgresql://blog:blog@postgres:5432/blog_prod --port 5556 --browser none"

volumes:
  postgres-data:
